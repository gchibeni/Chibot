[project]
name = "chibot"
version = "0.1.0"
description = "A lightweight, self-hosted Discord bot built to run beautifully on a Raspberry Pi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.7.1",
    "discord-ext-voice-recv==0.5.2a179",
    "PyNaCl==1.5.0",
    "colorama==0.4.6",
    # yt-dlp must stay reasonably current: YouTube layout changes routinely
    # break old versions (e.g. playlists extracting 0 items).
    "yt-dlp>=2025.3.27",
    "pydub==0.25.1",
    "pyotp==2.9.0",
    "urllib3==2.3.0",
    # Offline speech recognition for voice triggers. Small en/pt models are
    # downloaded to ./models on first use — see scripts/speech.py.
    "vosk==0.3.45",
    # Whisper (CTranslate2 build) transcribes voice commands after a wake
    # phrase. The model downloads on first use — see scripts/speech.py.
    "faster-whisper==1.2.1",
    # Ships an ffmpeg binary in the wheel, so a fresh clone can play and
    # convert audio without ffmpeg being installed system-wide. A system
    # ffmpeg still wins when present — see scripts/runtime.py.
    "imageio-ffmpeg==0.6.0",
    # pydub imports the stdlib "audioop" module, removed in Python 3.13 (PEP 594).
    # audioop-lts is the standalone replacement, needed only on 3.13+.
    "audioop-lts>=0.2.1 ; python_version >= '3.13'",
]

[project.scripts]
# Installed into the environment, so "uv run chibot" starts the bot.
chibot = "scripts.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
# The uv cache and the project often live on different drives, where
# hardlinking isn't supported. Copying avoids a warning on every sync.
link-mode = "copy"
